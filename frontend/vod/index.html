<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FamilyStream VOD</title><style>body{font-family:system-ui;background:#101827;color:#eef2ff;margin:0}main{max-width:1200px;margin:auto;padding:32px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}button,input,select{padding:10px;border-radius:8px;border:1px solid #40567f;background:#111a2b;color:#fff}button{cursor:pointer;background:#2563eb}table{width:100%;border-collapse:collapse;background:#18243a}td,th{text-align:left;padding:10px;border-bottom:1px solid #2b3b5c}</style></head><body><main><h1>Catálogo VOD remoto</h1><p>Somente metadata, STRM e NFO ocupam o disco; o vídeo é encaminhado pelo proxy estável.</p><div class="toolbar"><select id="type"><option value="movie">Filmes</option><option value="series">Séries</option></select><input id="q" placeholder="Buscar título"><button onclick="load()">Buscar</button><button onclick="sync('archive_org')">Sincronizar Archive.org</button><button onclick="sync('wikimedia_commons')">Sincronizar Wikimedia</button><button onclick="sync('nasa')">Sincronizar NASA</button></div><p id="status"></p><table><thead><tr><th>Título</th><th>Ano</th><th>Direitos</th><th>Status</th><th>Última atualização</th></tr></thead><tbody id="rows"></tbody></table></main><script>async function load(){const t=document.querySelector('#type').value,q=document.querySelector('#q').value;const d=await fetch('/api/v1/vod?item_type='+t+'&q='+encodeURIComponent(q)).then(r=>r.json());document.querySelector('#rows').innerHTML=d.items.map(x=>`<tr><td>${x.title}</td><td>${x.year||''}</td><td>${x.rights_status}</td><td>${x.stream_status}</td><td>${x.last_seen||''}</td></tr>`).join('')}async function sync(p){document.querySelector('#status').textContent='Sincronizando '+p+'…';const r=await fetch('/api/v1/vod/sync?provider='+p+'&limit=10',{method:'POST'});document.querySelector('#status').textContent=await r.text();load()}load()</script></body></html>
