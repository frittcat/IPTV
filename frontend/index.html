<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GaloDoidoTV</title><style>body{font-family:system-ui;background:#070707;color:#f5f5f5;margin:0}main{max-width:1100px;margin:auto;padding:32px}h1{margin-top:0;color:#f5c400}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}.card{background:#151515;border:1px solid #3a3215;border-radius:12px;padding:18px}.value{font-size:2rem;font-weight:700;color:#f5c400}button,input{padding:10px;border-radius:8px;border:1px solid #5f521d;background:#111;color:#fff}button{cursor:pointer;background:#d5a900;color:#090909;border:0;margin:4px 0;font-weight:700}.toolbar{display:flex;gap:8px;margin:18px 0;flex-wrap:wrap}table{width:100%;border-collapse:collapse;background:#151515}td,th{text-align:left;padding:10px;border-bottom:1px solid #302a14}a{text-decoration:none}</style></head><body><main><h1>GaloDoidoTV</h1><p>Central de Live TV, filmes, séries, playback e saúde das fontes.</p><div id="cards" class="grid"></div><div class="toolbar"><input id="q" placeholder="Buscar canal"><button onclick="loadChannels()">Buscar</button><button onclick="sync()">Sincronizar fontes</button><a href="/docs"><button>API Docs</button></a><a href="/admin/vod"><button>VOD</button></a></div><p id="status"></p><table><thead><tr><th>Canal</th><th>País</th><th>Categorias</th><th>Publicado</th></tr></thead><tbody id="rows"></tbody></table></main><script>const labels={channels_discovered:'Descobertos',channels_published:'Publicados',healthy_streams:'Streams saudáveis',degraded_streams:'Degradados',offline_streams:'Offline',fallback_streams:'Fallbacks',vod_items:'VOD',with_epg:'Com EPG',brazil:'Brasil',france:'França',portugal:'Portugal',international:'Internacional'};async function stats(){const d=await fetch('/api/stats').then(r=>r.json());document.querySelector('#cards').innerHTML=Object.entries(d).map(([k,v])=>`<div class="card"><div>${labels[k]||k}</div><div class="value">${v}</div></div>`).join('')}async function loadChannels(){const q=document.querySelector('#q').value;const d=await fetch('/api/channels?q='+encodeURIComponent(q)).then(r=>r.json());document.querySelector('#rows').innerHTML=d.slice(0,200).map(x=>`<tr><td>${x.name}</td><td>${x.country||''}</td><td>${x.categories||''}</td><td>${x.published?'sim':'não'}</td></tr>`).join('')}async function sync(){document.querySelector('#status').textContent='Sincronizando…';const r=await fetch('/api/sync',{method:'POST'});document.querySelector('#status').textContent=r.ok?'Sincronização concluída.':'Falha na sincronização.';stats();loadChannels()}stats();loadChannels();</script></body></html>
