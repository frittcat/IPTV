name: FamilyStream CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: familystream
          POSTGRES_USER: familystream
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U familystream -d familystream"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt
      - name: Unit tests (SQLite/default)
        run: python -m pytest -q
      - name: PostgreSQL schema smoke
        env:
          DATABASE_URL: postgresql://familystream:test@localhost:5432/familystream
        run: python -c "from backend.app import init_db; init_db(); print('postgres schema ok')"
      - name: Compile Python modules
        run: python -m compileall -q backend providers
      - name: XML parser smoke
        run: python -c "import xml.etree.ElementTree as ET; ET.fromstring('<tv><channel id=\"x\"><display-name>x</display-name></channel></tv>'); print('xml validation ok')"
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build runtime image
        run: docker build -t familystream-ci .
      - name: Verify ffprobe runtime dependency
        run: docker run --rm familystream-ci ffprobe -version
      - name: Verify media probe module imports
        run: docker run --rm familystream-ci python -c "from backend.media_probe import build_ffprobe_command; print(build_ffprobe_command('http://127.0.0.1:8080/probe')[0])"
