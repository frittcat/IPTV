name: GaloDoidoTV CI
on:
  push:
    branches: [main, v0.3-platform]
  pull_request:
    branches: [main]

# Rapid development commits used to leave several Android jobs publishing the
# same release tag at once. GitHub's --clobber implementation deletes/recreates
# assets, so concurrent publishers could race and one upload would receive 404.
# Keep only the newest run for a branch/ref.
concurrency:
  group: galodoidotv-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: familystream
          POSTGRES_USER: familystream
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U familystream -d familystream"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt
      - name: Unit tests (SQLite/default)
        run: python -m pytest -q
      - name: PostgreSQL schema smoke
        env:
          DATABASE_URL: postgresql://familystream:test@localhost:5432/familystream
        run: python -c "from backend.app import init_db; init_db(); print('postgres schema ok')"
      - name: Compile Python modules
        run: python -m compileall -q backend providers
      - name: XML parser smoke
        run: python -c "import xml.etree.ElementTree as ET; ET.fromstring('<tv><channel id=\"x\"><display-name>x</display-name></channel></tv>'); print('xml validation ok')"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build runtime image
        run: docker build -t galodoidotv-ci .
      - name: Verify ffprobe runtime dependency
        run: docker run --rm galodoidotv-ci ffprobe -version
      - name: Verify media probe module imports
        run: docker run --rm galodoidotv-ci python -c "from backend.media_probe import build_ffprobe_command; print(build_ffprobe_command('http://127.0.0.1:8080/probe')[0])"

  android-tv:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Assemble GaloDoidoTV Android TV debug APK
        working-directory: clients/android-tv
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Upload GaloDoidoTV Android TV debug APK
        uses: actions/upload-artifact@v4
        with:
          name: galodoidotv-android-tv-debug
          path: clients/android-tv/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Prepare persistent release signing
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Persistent Android signing secrets are not configured; stable release publication is skipped."
            exit 0
          fi
          KEYSTORE_PATH="$RUNNER_TEMP/galodoidotv-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          echo "available=true" >> "$GITHUB_OUTPUT"
          echo "keystore_path=$KEYSTORE_PATH" >> "$GITHUB_OUTPUT"

      - name: Assemble signed GaloDoidoTV Android TV release APK
        if: steps.signing.outputs.available == 'true'
        working-directory: clients/android-tv
        env:
          GALODOIDOTV_KEYSTORE_PATH: ${{ steps.signing.outputs.keystore_path }}
          GALODOIDOTV_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          GALODOIDOTV_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          GALODOIDOTV_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Build automatic update manifest
        if: steps.signing.outputs.available == 'true'
        run: |
          cp clients/android-tv/app/build/outputs/apk/release/app-release.apk GaloDoidoTV-AndroidTV-latest.apk
          python - <<'PY'
          import hashlib
          import json
          import pathlib
          import re

          gradle = pathlib.Path('clients/android-tv/app/build.gradle.kts').read_text(encoding='utf-8')
          version_code = int(re.search(r'versionCode\s*=\s*(\d+)', gradle).group(1))
          version_name = re.search(r'versionName\s*=\s*"([^"]+)"', gradle).group(1)
          apk = pathlib.Path('GaloDoidoTV-AndroidTV-latest.apk')
          sha256 = hashlib.sha256(apk.read_bytes()).hexdigest()
          payload = {
              'version_code': version_code,
              'version_name': version_name,
              'required': True,
              'apk_url': 'https://github.com/frittcat/IPTV/releases/download/android-tv-dev/GaloDoidoTV-AndroidTV-latest.apk',
              'sha256': sha256,
              'notes': 'Nova versão do GaloDoidoTV disponível. A atualização mantém suas configurações e substitui o aplicativo atual.',
          }
          pathlib.Path('GaloDoidoTV-AndroidTV-update.json').write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          print(f"update manifest versionCode={version_code} sha256={sha256}")
          PY

      - name: Publish stable GaloDoidoTV APK and updater metadata
        if: github.event_name == 'push' && github.ref == 'refs/heads/v0.3-platform' && steps.signing.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view android-tv-dev >/dev/null 2>&1; then
            gh release delete-asset android-tv-dev FamilyStream-AndroidTV-latest.apk -y >/dev/null 2>&1 || true
            gh release upload android-tv-dev GaloDoidoTV-AndroidTV-latest.apk GaloDoidoTV-AndroidTV-update.json --clobber
            gh release edit android-tv-dev \
              --title "GaloDoidoTV Android TV development" \
              --notes "Signed Android TV build with in-app automatic update support."
          else
            gh release create android-tv-dev GaloDoidoTV-AndroidTV-latest.apk GaloDoidoTV-AndroidTV-update.json \
              --title "GaloDoidoTV Android TV development" \
              --notes "Signed Android TV build with in-app automatic update support." \
              --prerelease \
              --target "$GITHUB_SHA"
          fi
