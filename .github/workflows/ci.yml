name: FamilyStream CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: familystream
          POSTGRES_USER: familystream
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U familystream -d familystream"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python -m compileall -q backend providers
      - run: python - <<'PY'
          import xml.etree.ElementTree as ET
          ET.fromstring('<tv><channel id="x"><display-name>x</display-name></channel></tv>')
          print('xml validation ok')
        shell: bash
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build .
