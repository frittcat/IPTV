name: GaloDoidoTV CI
on:
  push:
    branches: [main, v0.3-platform]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: familystream
          POSTGRES_USER: familystream
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U familystream -d familystream"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt
      - name: Unit tests (SQLite/default)
        run: python -m pytest -q
      - name: PostgreSQL schema smoke
        env:
          DATABASE_URL: postgresql://familystream:test@localhost:5432/familystream
        run: python -c "from backend.app import init_db; init_db(); print('postgres schema ok')"
      - name: Compile Python modules
        run: python -m compileall -q backend providers
      - name: XML parser smoke
        run: python -c "import xml.etree.ElementTree as ET; ET.fromstring('<tv><channel id=\"x\"><display-name>x</display-name></channel></tv>'); print('xml validation ok')"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build runtime image
        run: docker build -t galodoidotv-ci .
      - name: Verify ffprobe runtime dependency
        run: docker run --rm galodoidotv-ci ffprobe -version
      - name: Verify media probe module imports
        run: docker run --rm galodoidotv-ci python -c "from backend.media_probe import build_ffprobe_command; print(build_ffprobe_command('http://127.0.0.1:8080/probe')[0])"

  android-tv:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Assemble GaloDoidoTV Android TV debug APK
        working-directory: clients/android-tv
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Upload GaloDoidoTV Android TV debug APK
        uses: actions/upload-artifact@v4
        with:
          name: galodoidotv-android-tv-debug
          path: clients/android-tv/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish stable latest APK URL
        if: github.event_name == 'push' && github.ref == 'refs/heads/v0.3-platform'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp clients/android-tv/app/build/outputs/apk/debug/app-debug.apk GaloDoidoTV-AndroidTV-latest.apk
          # Compatibility alias keeps the existing Downloader code 6093932 working.
          cp clients/android-tv/app/build/outputs/apk/debug/app-debug.apk FamilyStream-AndroidTV-latest.apk
          if gh release view android-tv-dev >/dev/null 2>&1; then
            gh release upload android-tv-dev GaloDoidoTV-AndroidTV-latest.apk FamilyStream-AndroidTV-latest.apk --clobber
          else
            gh release create android-tv-dev GaloDoidoTV-AndroidTV-latest.apk FamilyStream-AndroidTV-latest.apk \
              --title "GaloDoidoTV Android TV development" \
              --notes "Development APK. GaloDoidoTV is the active brand; the legacy asset is retained only so the existing Downloader code keeps working." \
              --prerelease \
              --target "$GITHUB_SHA"
          fi
